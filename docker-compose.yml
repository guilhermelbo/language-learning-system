services:
  stt:
    build:
      context: ./ai_services/stt
      dockerfile: Dockerfile
    container_name: lingo-stt
    ports:
      - "8001:8001"
    restart: unless-stopped

  tts:
    build:
      context: ./ai_services/tts
      dockerfile: Dockerfile
    container_name: lingo-tts
    ports:
      - "8002:8002"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lingo-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-Qwen3.5-35B-A3B-UD-IQ3_S.gguf}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1024}
      - LLM_ENABLE_THINKING=${LLM_ENABLE_THINKING:-False}
      - STT_API_URL=http://stt:8001
      - TTS_API_URL=http://tts:8002
      - PIPER_MODEL_PATH=pt_BR-faber-medium.onnx
      - VOICE_ENABLED=${VOICE_ENABLED:-false}
      - VOICE_PROVIDER=${VOICE_PROVIDER:-generic}
      # VOICE_API_URL deve apontar para o servidor de voz rodando externamente.
      # Exemplo: http://host.docker.internal:8003 se rodando na mesma máquina.
      - VOICE_API_URL=${VOICE_API_URL:-http://host.docker.internal:8003}
      - VOICE_TIMEOUT_SECONDS=${VOICE_TIMEOUT_SECONDS:-30}
      - VOICE_MAX_AUDIO_SECONDS=${VOICE_MAX_AUDIO_SECONDS:-60}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lingo-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
